name: Deploy to Server via SSH

on:
  push:
    branches: [ main, master ]  # 监听主分支推送
  workflow_dispatch:           # 允许手动触发

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0  # 获取完整历史，用于检测变更
    
    - name: Install SSH client and rsync
      run: |
        sudo apt-get update
        sudo apt-get install -y sshpass rsync
    
    - name: Prepare deployment directory
      run: |
        # 创建部署目录 /var/www/img（如果不存在）
        sshpass -p "${{ secrets.SERVER_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "sudo mkdir -p /var/www/img && sudo chown ${{ secrets.SERVER_USER }}:${{ secrets.SERVER_USER }} /var/www/img"
    
    - name: Deploy changed files via rsync
      run: |
        # 使用rsync仅同步变更的文件到 /var/www/img
        sshpass -p "${{ secrets.SERVER_PASSWORD }}" rsync -avz \
          --exclude='.git' \
          --exclude='.github' \
          --exclude='node_modules' \
          --exclude='.env' \
          --exclude='*.log' \
          --exclude='.DS_Store' \
          --exclude='*.tmp' \
          --delete \
          -e "ssh -o StrictHostKeyChecking=no" \
          ./ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/var/www/img/
    
    - name: Set permissions (optional)
      run: |
        # 设置目录权限（根据您的需求调整）
        sshpass -p "${{ secrets.SERVER_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
          sudo chown -R www-data:www-data /var/www/img
          sudo chmod -R 755 /var/www/img
          echo "✅ Deployment to /var/www/img completed successfully!"
          echo "📁 部署路径: /var/www/img"
          echo "📊 文件总数: $(find /var/www/img -type f | wc -l)"
        EOF
