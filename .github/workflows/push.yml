name: Deploy to Caddy Server

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0  # 获取完整历史，用于检测变更
    
    - name: Install rsync and sshpass
      run: |
        sudo apt-get update
        sudo apt-get install -y sshpass rsync
    
    - name: Get changed files
      id: changed-files
      uses: tj-actions/changed-files@v35
      with:
        files: |
          **
    
    - name: Sync changed files to server
      if: steps.changed-files.outputs.any_changed == 'true'
      run: |
        # 只同步变更的文件到 /var/www/img
        sshpass -p "${{ secrets.SERVER_PASSWORD }}" rsync -avz \
          --exclude='.git' \
          --exclude='.github' \
          --exclude='node_modules' \
          --exclude='.env' \
          --exclude='*.log' \
          --exclude='.DS_Store' \
          --exclude='*.tmp' \
          -e "ssh -o StrictHostKeyChecking=no" \
          ./ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/var/www/img/
        
        echo "✅ 文件同步完成"
    
    - name: Set permissions for Caddy
      run: |
        sshpass -p "${{ secrets.SERVER_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
          cd /var/www/img
          
          # 确定Caddy用户
          if id "caddy" &>/dev/null; then
            CADDY_USER="caddy"
          elif id "www-data" &>/dev/null; then
            CADDY_USER="www-data"
          else
            CADDY_USER="${{ secrets.SERVER_USER }}"
          fi
          
          # 设置权限
          sudo chown -R $CADDY_USER:$CADDY_USER .
          sudo find . -type d -exec chmod 755 {} \;
          sudo find . -type f -exec chmod 644 {} \;
          
          echo "✅ 部署完成"
          echo "📁 路径: /var/www/img"
          echo "👤 Caddy用户: $CADDY_USER"
          echo "📅 时间: $(date '+%Y-%m-%d %H:%M:%S')"
        EOF
    
    - name: Deployment summary
      run: |
        echo "## 部署摘要" >> $GITHUB_STEP_SUMMARY
        echo "✅ 部署成功" >> $GITHUB_STEP_SUMMARY
        echo "📁 路径: /var/www/img" >> $GITHUB_STEP_SUMMARY
        echo "🔄 变更文件数: ${{ steps.changed-files.outputs.all_changed_files_count }}" >> $GITHUB_STEP_SUMMARY
